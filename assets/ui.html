<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroTorr</title>
<style>
:root{--bg:#0e1116;--fg:#dde3ea;--mut:#7a8699;--acc:#4da3ff;--ok:#39c26d;--err:#e5484d;--card:#161b23}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
h1 span{color:var(--acc)}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;background:#0b0e13;border:1px solid #2a3140;color:var(--fg);border-radius:8px;padding:8px 10px;font-size:14px}
button{background:var(--acc);border:0;color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
button.sec{background:#232b38}
.mut{color:var(--mut);font-size:12px}
.t{padding:8px 0;border-bottom:1px solid #222937}
.t:last-child{border-bottom:0}
.t .n{font-weight:600;word-break:break-all}
.t .s{font-size:12px;color:var(--mut)}
.t .bar{height:4px;background:#232b38;border-radius:2px;margin-top:6px;overflow:hidden}
.t .bar i{display:block;height:100%;background:var(--acc)}
.f{padding:6px 0;font-size:13px;word-break:break-all;display:flex;justify-content:space-between;gap:8px}
.f a{color:var(--acc);text-decoration:none;white-space:nowrap}
.pill{font-size:11px;border-radius:20px;padding:2px 8px;background:#232b38;color:var(--mut)}
.pill.ok{color:#0b2; background:#12281c}
pre{white-space:pre-wrap;word-break:break-all}
/* --- настройки --- */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sh b{font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.fld input[type=number],.fld input[type=text],.fld select{background:#0b0e13;border:1px solid #2a3140;color:var(--fg);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
.fld.wide{grid-column:1/-1}
.grp{grid-column:1/-1;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-top:6px;border-bottom:1px solid #222937;padding-bottom:4px}
.chks{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;align-self:end;padding-bottom:7px}
.chk input{accent-color:var(--acc);width:15px;height:15px}
@media(max-width:520px){.grid,.chks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Zero<span>Torr</span> <span class="mut" id="ver"></span></h1>
<div class="card">
  <div class="row">
    <input type="text" id="link" placeholder="magnet: или ссылка на .torrent">
    <button onclick="add()">Добавить</button>
  </div>
  <div class="mut" style="margin-top:6px">torrents.json / кэш — в каталоге -d</div>
</div>
<div class="card" id="list"><div class="mut">загрузка…</div></div>
<div class="card" id="setcard">
  <div class="sh"><b>⚙ Настройки сервера</b><span class="mut" id="sethint"></span></div>
  <div id="setbody"><div class="mut">загрузка…</div></div>
</div>
<div class="card mut" id="msg"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sz=b=>{b=+b||0;const u=["B","KB","MB","GB","TB"];let i=0;while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(i?1:0)+" "+u[i]};
async function api(p,o){const r=await fetch(p,o);const t=await r.text();try{return JSON.parse(t)}catch{return t}}
async function add(){
  const link=$("#link").value.trim(); if(!link) return;
  $("#msg").textContent="добавление…";
  const res=await api("/torrents",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"add",link,save_to_db:true})});
  $("#msg").textContent=res.hash?("добавлено: "+res.hash):("ошибка: "+(res||""));
  refresh();
}
async function rem(h){await api("/torrents",{method:"POST",body:JSON.stringify({action:"rem",hash:h})});refresh()}
async function drop(h){await api("/torrents",{method:"POST",body:JSON.stringify({action:"drop",hash:h})});refresh()}
const STAT={0:"добавлен",1:"метаданные",2:"префетч",3:"работает",4:"закрыт",5:"в БД"};
function render(ts){
  if(!ts.length){$("#list").innerHTML='<div class="mut">торрентов нет</div>';return}
  $("#list").innerHTML=ts.map(t=>{
    const pct=t.torrent_size?Math.round(100*(t.loaded_size||0)/t.torrent_size):0;
    const files=(t.file_stats||[]).map(f=>{
      const media=/\.(mp4|mkv|avi|mov|m4v|webm|ts|flv|wmv|mp3|flac|m4a|aac|ogg|wav)$/i.test(f.path);
      const u="/stream/"+encodeURIComponent(f.path.split("/").pop())+"?link="+t.hash+"&index="+f.id+"&play";
      return '<div class="f"><span>'+esc(f.path.split("/").pop())+' <span class="mut">'+sz(f.length)+'</span></span>'
        +(media?'<a href="'+u+'">▶ стрим</a>':'')+'</div>';
    }).join("");
    return '<div class="t"><div class="n">'+esc(t.title||t.name||t.hash)+'</div>'
      +'<div class="s"><span class="pill'+(t.stat==3?" ok":"")+'">'+(STAT[t.stat]||t.stat)+'</span> '
      +sz(t.loaded_size)+' / '+sz(t.torrent_size)
      +(t.download_speed?' · ↓'+sz(t.download_speed)+'/s':'')
      +(t.upload_speed?' · ↑'+sz(t.upload_speed)+'/s':'')
      +' · <span class="mut">'+t.hash.slice(0,12)+'…</span></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
      +'<div style="margin-top:6px">'+files+'</div>'
      +'<div class="s" style="margin-top:6px"><a href="javascript:void(0)" onclick="drop(\''+t.hash+'\')">выгрузить</a> · '
      +'<a href="javascript:void(0)" onclick="rem(\''+t.hash+'\')">удалить</a></div>'
      +'</div>';
  }).join("");
}
async function refresh(){
  const res=await api("/torrents",{method:"POST",body:JSON.stringify({action:"list"})});
  if(Array.isArray(res)) render(res); else if(res&&res.torrents) render(res.torrents);
}
/* ---------- настройки: все поля BTSets (совместимо с TorrServer) ---------- */
const MB=1048576;
const GROUPS=[
 ["Кэш и диск",[
   ["num","CacheSize","Размер кэша, МиБ"],
   ["num","ReaderReadAHead","Чтение вперёд, %"],
   ["num","PreloadCache","Префетч, %"],
   ["chk","UseDisk","Хранить кэш на диске"],
   ["txt","TorrentsSavePath","Каталог для скачанных файлов"],
   ["chk","RemoveCacheOnDrop","Чистить кэш при выгрузке"]]],
 ["Сеть и пиры",[
   ["num","ConnectionsLimit","Соединений на торрент"],
   ["num","PeersListenPort","Порт пиров (0 — авто)"],
   ["num","TorrentDisconnectTimeout","Таймаут пира, с"],
   ["sel","RetrackersMode","Ретрекеры",[[0,"не добавлять"],[1,"добавлять"],[2,"заменять"]]],
   ["chk","ForceEncrypt","Принудительное шифрование"],
   ["chk","EnableIPv6","IPv6"],
   ["chk","DisableTCP","Отключить TCP"],
   ["chk","DisableUTP","Отключить uTP"],
   ["chk","DisableUPNP","Отключить UPnP"],
   ["chk","DisableDHT","Отключить DHT"],
   ["chk","DisablePEX","Отключить PEX"]]],
 ["Скорость (КиБ/с, 0 — без лимита)",[
   ["num","DownloadRateLimit","Скачивание"],
   ["num","UploadRateLimit","Раздача"],
   ["chk","DisableUpload","Отключить раздачу"]]],
 ["Сервис",[
   ["chk","EnableDLNA","DLNA"],
   ["chk","EnableDebug","Отладочный лог"]]]
];
function buildSets(){
  let h='<div class="grid">';
  for(const[grp,fields]of GROUPS){
    h+='<div class="grp">'+esc(grp)+'</div>';
    for(const f of fields){
      const t=f[0],id=f[1];
      if(t==="num") h+='<label class="fld">'+esc(f[2])+'<input id="s_'+id+'" type="number" inputmode="numeric"></label>';
      else if(t==="txt") h+='<label class="fld wide">'+esc(f[2])+'<input id="s_'+id+'" type="text"></label>';
      else if(t==="sel") h+='<label class="fld">'+esc(f[2])+'<select id="s_'+id+'">'+f[3].map(o=>'<option value="'+o[0]+'">'+esc(o[1])+'</option>').join("")+'</select></label>';
      else h+='<label class="chk"><input id="s_'+id+'" type="checkbox"> '+esc(f[2])+'</label>';
    }
  }
  h+='</div><div class="row" style="margin-top:10px">'
    +'<button onclick="saveSets()">Сохранить</button>'
    +'<button class="sec" onclick="defSets()">По умолчанию</button></div>';
  $("#setbody").innerHTML=h;
}
function fillSets(s){
  if(!s||typeof s!=="object")return;
  for(const[,fields]of GROUPS)for(const f of fields){
    const el=$("#s_"+f[1]); if(!el)continue;
    if(f[0]==="num") el.value=(f[1]==="CacheSize"?Math.round((+s.CacheSize||0)/MB):(+s[f[1]]||0));
    else if(f[0]==="chk") el.checked=!!s[f[1]];
    else if(f[0]==="sel") el.value=+s[f[1]]||0;
    else el.value=s[f[1]]??"";
  }
}
function collectSets(){
  const sets={};
  for(const[,fields]of GROUPS)for(const f of fields){
    const id=f[1];
    if(f[0]==="num"){let v=+$("#s_"+id).value||0; if(id==="CacheSize")v=Math.round(v*MB); sets[id]=v}
    else if(f[0]==="chk") sets[id]=$("#s_"+id).checked;
    else if(f[0]==="sel") sets[id]=+$("#s_"+id).value;
    else sets[id]=$("#s_"+id).value;
  }
  return sets;
}
async function loadSets(){
  try{fillSets(await api("/settings",{method:"POST",body:JSON.stringify({action:"get"})}))}catch{}
}
async function saveSets(){
  $("#sethint").textContent="сохранение…";
  try{
    const r=await api("/settings",{method:"POST",body:JSON.stringify({action:"set",sets:collectSets()})});
    fillSets(r); // сервер возвращает значения после санитайза (лимиты профиля)
    $("#sethint").textContent="сохранено ✓"; setTimeout(()=>$("#sethint").textContent="",2500);
  }catch(e){$("#sethint").textContent="ошибка сохранения"}
}
async function defSets(){
  try{
    const r=await api("/settings",{method:"POST",body:JSON.stringify({action:"def"})});
    fillSets(r); $("#sethint").textContent="сброшено к значениям по умолчанию";
    setTimeout(()=>$("#sethint").textContent="",2500);
  }catch(e){$("#sethint").textContent="ошибка"}
}
(async()=>{
  try{$("#ver").textContent=await (await fetch("/echo")).text()}catch{}
  buildSets(); loadSets();
  const tick=()=>refresh().catch(()=>{});
  tick(); setInterval(tick,3000);
})();
</script>
</body>
</html>
