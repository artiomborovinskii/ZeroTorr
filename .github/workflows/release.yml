name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # --- LINUX (через cargo-zigbuild) ---
          - target: x86_64-unknown-linux-musl
            name: zerotorr-linux-amd64
            os: ubuntu-latest
            builder: zig
          - target: aarch64-unknown-linux-musl
            name: zerotorr-linux-arm64
            os: ubuntu-latest
            builder: zig
            
          # Спец-сборка под Cortex-A53 (Аппаратное ускорение)
          - target: aarch64-unknown-linux-musl
            name: zerotorr-linux-arm64-cortex-a53
            os: ubuntu-latest
            builder: zig
            rustflags: "-C target-cpu=cortex-a53 -C target-feature=+crypto,+crc,+aes,+sha2"
            
          # --- FREEBSD (кросс-компиляция через Zig) ---
          - target: x86_64-unknown-freebsd
            name: zerotorr-freebsd-amd64
            os: ubuntu-latest
            builder: zig

          # --- WINDOWS ---
          - target: x86_64-pc-windows-msvc
            name: zerotorr-windows-amd64.exe
            os: windows-latest
            builder: cargo

          # --- MACOS (Intel & Apple Silicon) ---
          - target: x86_64-apple-darwin
            name: zerotorr-macos-intel
            os: macos-latest
            builder: cargo
          - target: aarch64-apple-darwin
            name: zerotorr-macos-arm64
            os: macos-latest
            builder: cargo

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig and cargo-zigbuild (Ubuntu only)
        if: matrix.builder == 'zig'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install ziglang cargo-zigbuild

      - name: Build with cargo-zigbuild (Linux/FreeBSD)
        if: matrix.builder == 'zig'
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build with standard cargo (Windows/macOS)
        if: matrix.builder == 'cargo'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/zerotorr ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv target/${{ matrix.target }}/release/zerotorr.exe ${{ matrix.name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
